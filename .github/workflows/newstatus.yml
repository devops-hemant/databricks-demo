name: Deploy with State Tracking

on:
  workflow_dispatch:
  push:
    branches:
      - dev

env:
  FEATURE_NUMBER: "FEAT-${{ github.run_number }}"
  RUN_NUMBER: ${{ github.run_number }}
  TEAM: "teamHS"
  RELEASE_NUMBER: "CHG123456"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          ref: ${{ github.ref}}

      # 🚀 Step 2 — Deploy website
      - name: Upload website
        run: |
          az storage blob upload-batch \
            --account-name ${{ vars.AZURE_STORAGE_ACCOUNT }} \
            --destination '$web' \
            --source ./report \
            --sas-token "${{ secrets.AZSAS }}" \
            --overwrite

      - name: Update Releases
        run: |

              # ===== CONFIG =====
              ACCOUNT="${{ vars.AZURE_STORAGE_ACCOUNT }}"
              CONTAINER="\$web"   # or your container
              SAS_TOKEN="${{ secrets.AZSAS }}"   # ?sv=... (keep the ?)
              RELEASE="Release-CHG003"
              OUTPUT="output.csv"

              echo "Downloading $RELEASE ..."

              az storage blob download \
                --account-name "$ACCOUNT" \
                --container-name "$CONTAINER" \
                --name "releases.json" \
                --file "releases.json" \
                --sas-token "$SAS_TOKEN"

               if [ -f releases.json ] || echo '{"releases":[]}' > releases.json

                jq --arg newRelease "$RELEASE" \
                '.releases |= ([ $newRelease ] + map(select(. != $newRelease)))' \
                releases.json > tmp.json && mv tmp.json releases.json

              az storage blob upload \
                --account-name "$ACCOUNT" \
                --container-name "$CONTAINER" \
                --name "releases.json" \
                --file "releases.json" \
                --sas-token "$SAS_TOKEN" \
                --overwrite


      - name: Update Deployment Report
        run: |

              # ===== CONFIG =====
              ACCOUNT="${{ vars.AZURE_STORAGE_ACCOUNT }}"
              CONTAINER="\$web"   # or your container
              SAS_TOKEN="${{ secrets.AZSAS }}"   # ?sv=... (keep the ?)
              RELEASE="Release-CHG003"
              OUTPUT="output.csv"

              echo "Downloading $RELEASE ..."

              echo "======================================"
              echo "Processing Release: $RELEASE"
              echo "======================================"

              # =========================
              # Download release folder
              # =========================
              echo "Downloading blobs..."
              az storage blob download-batch \
                --account-name "$ACCOUNT" \
                --source "$CONTAINER" \
                --destination "." \
                --pattern "$RELEASE/*" \
                --sas-token "$SAS_TOKEN"

              # =========================
              # Create CSV
              # =========================
              echo "Generating CSV..."
              echo "Release,Repo,Team,ID,Filename,Status" > "$OUTPUT"

              find "./$RELEASE" -type f | while read -r file; do
                # Example path:
                # ./Release-CHG001/repo/team/id/passed/file.txt

                path=${file#./}

                IFS='/' read -r rel repo team id status filename <<< "$path"

                # Skip invalid paths
                if [ -z "$filename" ]; then
                  continue
                fi

                echo "$rel,$repo,$team,$id,$filename,$status" >> "$OUTPUT"
              done

              echo "CSV created: $OUTPUT"

              # =========================
              # Upload CSV back to blob
              # =========================
              echo "Uploading CSV to blob..."

              az storage blob upload \
                --account-name "$ACCOUNT" \
                --container-name "$CONTAINER" \
                --name "$RELEASE/data.csv" \
                --file "$OUTPUT" \
                --sas-token "$SAS_TOKEN" \
                --overwrite

              echo "======================================"
              echo "Done ✅ CSV uploaded to $RELEASE/data.csv"
              echo "======================================"