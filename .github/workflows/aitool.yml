name: 'AI inference'
on: 
  workflow_dispatch:
    inputs:
      text:
        type: string
        description: 'Enter the prompt'
        required: true
      

jobs:
  inference:
    permissions:
      models: read
    runs-on: ubuntu-latest
    steps:
      - name: files
        run: |
            touch pass.txt
            touch fail.txt
            echo "file1" >> pass.txt
            echo "file4" >> fail.txt
            
      - name: Test Local Action
        id: inference
        uses: actions/ai-inference@v1
        with:
          prompt: ${{ inputs.text }}

      - name: Print Output
        id: output
        run: echo "${{ steps.inference.outputs.response }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-build-artifact
          path: output.csv
      
