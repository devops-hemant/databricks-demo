name: Deploy with State Tracking

on:
  workflow_dispatch:
  push:
    branches:
      - dev

env:
  FEATURE_NUMBER: "FEAT-${{ github.run_number }}"
  RUN_NUMBER: ${{ github.run_number }}
  TEAM: "teamHS"
  RELEASE_NUMBER: "CHG123456"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          ref: ${{ github.ref}}

      # 🚀 Step 2 — Deploy website
      - name: Upload website
        run: |
          az storage blob upload-batch \
            --account-name ${{ vars.AZURE_STORAGE_ACCOUNT }} \
            --destination '$web' \
            --source ./report \
            --sas-token "${{ secrets.AZSAS }}" \
            --overwrite

      # ✅ Step 3 — Mark SUCCESS
      - name: Set state = success
        run: |
          echo "${{ github.repository }} ${{ env.FEATURE_NUMBER }} ${{ env.TEAM }} file1 SUCCESS" >> $FEATURE_NUMBER.txt
          echo "${{ github.repository }} ${{ env.FEATURE_NUMBER }} ${{ env.TEAM }} file2 FAILED" >> $FEATURE_NUMBER.txt
          echo "${{ github.repository }} ${{ env.FEATURE_NUMBER }} ${{ env.TEAM }} file3 SUCCESS" >> $FEATURE_NUMBER.txt

          az storage blob upload \
            --account-name ${{ vars.AZURE_STORAGE_ACCOUNT }} \
            --container-name '$web' \
            --name $RELEASE_NUMBER/$FEATURE_NUMBER.txt \
            --file $FEATURE_NUMBER.txt \
            --sas-token "${{ secrets.AZSAS }}" \
            --overwrite

      - name: Update the index.json
        run: |
          az storage blob list \
            --account-name "${{ vars.AZURE_STORAGE_ACCOUNT }}" \
            --container-name '$web' \
            --prefix $RELEASE_NUMBER/ \
            --sas-token "${{ secrets.AZSAS }}" \
            --query "[?ends_with(name, '.txt')].name" \
            -o json | jq 'map(sub("^$RELEASE_NUMBER/"; ""))' > index.json
          
      - name: Upload index.json
        run: |
          az storage blob upload \
            --account-name ${{ vars.AZURE_STORAGE_ACCOUNT }} \
            --container-name '$web' \
            --name $RELEASE_NUMBER/index.json \
            --file index.json \
            --sas-token "${{ secrets.AZSAS }}" \
            --overwrite

      - name: Update releases.json
        run: |
            for i in {1..5}; do
            echo "Attempt $i"

            # Download existing releases.json (or create empty)
            az storage blob download \
                --account-name ${{ vars.AZURE_STORAGE_ACCOUNT }} \
                --container-name '$web' \
                --name releases.json \
                --file releases.json \
                --sas-token "${{ secrets.AZSAS }}" \
                || echo "[]" > releases.json

            # Add release if not already present
            jq --arg rel "$RELEASE_NUMBER" '
                if index($rel) then . else . + [$rel] end
            ' releases.json > new_releases.json

            # Optional: sort releases
            jq 'sort' new_releases.json > final_releases.json

            # Upload back
            az storage blob upload \
                --account-name ${{ vars.AZURE_STORAGE_ACCOUNT }} \
                --container-name '$web' \
                --name releases.json \
                --file final_releases.json \
                --sas-token "${{ secrets.AZSAS }}" \
                --overwrite && break

            echo "Retrying due to conflict..."
            sleep 2
            done

      