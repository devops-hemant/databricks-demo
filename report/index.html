<!DOCTYPE html>
<html>
<head>
  <title>Deployment Dashboard</title>
  <style>
    body {
      font-family: Arial;
      padding: 20px;
      background: #f4f6f8;
    }

    h2 {
      margin-bottom: 20px;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      background: white;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: left;
    }

    th {
      background: #222;
      color: white;
    }

    .SUCCESS {
      color: green;
      font-weight: bold;
    }

    .FAILED {
      color: red;
      font-weight: bold;
    }

    .success-bg {
      background: #e6ffed;
    }

    .failed-bg {
      background: #ffe6e6;
    }

    .badge {
      padding: 3px 8px;
      border-radius: 5px;
      font-size: 12px;
      display: inline-block;
    }

    #search {
      margin-bottom: 15px;
      padding: 8px;
      width: 300px;
      border: 1px solid #ccc;
    }
  </style>
</head>
<body>

<h2>📊 Deployment File Status</h2>

<input type="text" id="search" placeholder="Search repo / feature / file...">

<table>
  <thead>
    <tr>
      <th>Run ID</th>
      <th>Repo</th>
      <th>Feature</th>
      <th>Team</th>
      <th>File</th>
      <th>Status</th>
    </tr>
  </thead>
  <tbody id="table-body">
    <tr><td colspan="6">Loading...</td></tr>
  </tbody>
</table>

<script>
  const basePath = "./state/";
  let allData = [];

  async function loadData() {
    try {
      const res = await fetch(basePath + "index.json");
      const files = await res.json();

      // Ensure latest files processed last
      files.sort();

      const map = new Map();

      for (const file of files) {
        const runId = file.replace(".txt", "");

        const r = await fetch(basePath + file);
        const text = await r.text();

        const lines = text.split("\n");

        for (const line of lines) {
          if (!line.trim()) continue;

          const parts = line.trim().split(" ");
          if (parts.length < 5) continue;

          const [repo, feature, team, filename, status] = parts;

          const key = `${repo}|${feature}|${team}|${filename}`;

          // overwrite → latest wins
          map.set(key, {
            runId,
            repo,
            feature,
            team,
            filename,
            status
          });
        }
      }

      allData = Array.from(map.values());
      renderTable(allData);

    } catch (err) {
      console.error(err);
      document.getElementById("table-body").innerHTML =
        "<tr><td colspan='6'>Error loading data</td></tr>";
    }
  }

  function renderTable(data) {
    let rows = "";

    for (const item of data) {
      const statusClass = item.status === "SUCCESS" ? "SUCCESS" : "FAILED";
      const bgClass = item.status === "SUCCESS" ? "success-bg" : "failed-bg";

      rows += `
        <tr class="${bgClass}">
          <td>${item.runId}</td>
          <td>${item.repo}</td>
          <td>${item.feature}</td>
          <td>${item.team}</td>
          <td>${item.filename}</td>
          <td class="${statusClass}">
            <span class="badge">${item.status}</span>
          </td>
        </tr>
      `;
    }

    document.getElementById("table-body").innerHTML =
      rows || "<tr><td colspan='6'>No data</td></tr>";
  }

  // 🔍 Search filter
  document.getElementById("search").addEventListener("input", function () {
    const value = this.value.toLowerCase();

    const filtered = allData.filter(item =>
      item.repo.toLowerCase().includes(value) ||
      item.feature.toLowerCase().includes(value) ||
      item.filename.toLowerCase().includes(value) ||
      item.team.toLowerCase().includes(value)
    );

    renderTable(filtered);
  });

  loadData();

  // 🔁 Auto refresh
  setInterval(loadData, 30);
</script>

</body>
</html>
