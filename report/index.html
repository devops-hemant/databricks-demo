<script>
  const basePath = "./state/";
  let allData = [];

  async function loadData() {
    try {
      const res = await fetch(basePath + "index.json");
      const files = await res.json();

      const seen = new Set();   // for deduplication
      const result = [];

      for (const file of files) {
        const runId = file.replace(".txt", "");

        const r = await fetch(basePath + file);
        const text = await r.text();

        const lines = text.split("\n");

        for (const line of lines) {
          if (!line.trim()) continue;

          const parts = line.trim().split(" ");
          if (parts.length < 5) continue;

          const [repo, feature, team, filename, status] = parts;

          // 🔑 Deduplication key
          const key = `${repo}|${feature}|${filename}|${status}`;

          if (seen.has(key)) continue;  // skip duplicate

          seen.add(key);

          result.push({
            runId,
            repo,
            feature,
            team,
            filename,
            status
          });
        }
      }

      allData = result;
      renderTable(allData);

    } catch (err) {
      console.error(err);
      document.getElementById("table-body").innerHTML =
        "<tr><td colspan='6'>Error loading data</td></tr>";
    }
  }

  function renderTable(data) {
    let rows = "";

    for (const item of data) {
      const statusClass = item.status === "SUCCESS" ? "SUCCESS" : "FAILED";
      const bgClass = item.status === "SUCCESS" ? "success-bg" : "failed-bg";

      rows += `
        <tr class="${bgClass}">
          <td>${item.runId}</td>
          <td>${item.repo}</td>
          <td>${item.feature}</td>
          <td>${item.team}</td>
          <td>${item.filename}</td>
          <td class="${statusClass}">
            <span class="badge">${item.status}</span>
          </td>
        </tr>
      `;
    }

    document.getElementById("table-body").innerHTML =
      rows || "<tr><td colspan='6'>No data</td></tr>";
  }

  // 🔍 Search
  document.getElementById("search").addEventListener("input", function () {
    const value = this.value.toLowerCase();

    const filtered = allData.filter(item =>
      item.repo.toLowerCase().includes(value) ||
      item.feature.toLowerCase().includes(value) ||
      item.filename.toLowerCase().includes(value) ||
      item.team.toLowerCase().includes(value)
    );

    renderTable(filtered);
  });

  loadData();
  setInterval(loadData, 30000);
</script>
