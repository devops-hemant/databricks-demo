<!DOCTYPE html>
<html>
<head>
  <title>Deployment Dashboard</title>
  <style>
    body { font-family: Arial; padding: 20px; background: #f5f5f5; }
    table { border-collapse: collapse; width: 100%; background: white; }
    th, td { border: 1px solid #ddd; padding: 10px; }
    th { background: #222; color: white; }
    .passed { color: green; font-weight: bold; }
    .failed { color: red; font-weight: bold; }
  </style>
</head>
<body>

<h2>📊 Deployment Status Table</h2>

<table>
  <thead>
    <tr>
      <th>Repo</th>
      <th>Feature</th>
      <th>Team</th>
      <th>File Name</th>
      <th>Status</th>
    </tr>
  </thead>
  <tbody id="table-body">
    <tr><td colspan="5">Loading...</td></tr>
  </tbody>
</table>

<script>
  const basePath = "./state/";

  async function loadData() {
    try {
      // Step 1: get list of run files
      const res = await fetch(basePath + "index.json");
      const files = await res.json();

      let rows = "";

      // Step 2: read each txt file
      for (const file of files) {
        const r = await fetch(basePath + file);
        const text = await r.text();

        const lines = text.split("\n");

        for (const line of lines) {
          if (!line.trim()) continue;

          // Expected format:
          // repo feature team filename status
          const parts = line.split(" ");

          if (parts.length < 5) continue;

          const [repo, feature, team, filename, status] = parts;

          rows += `
            <tr>
              <td>${repo}</td>
              <td>${feature}</td>
              <td>${team}</td>
              <td>${filename}</td>
              <td class="${status.toLowerCase()}">${status.toUpperCase()}</td>
            </tr>
          `;
        }
      }

      document.getElementById("table-body").innerHTML =
        rows || "<tr><td colspan='5'>No data</td></tr>";

    } catch (err) {
      console.error(err);
      document.getElementById("table-body").innerHTML =
        "<tr><td colspan='5'>Error loading data</td></tr>";
    }
  }

  loadData();

  // 🔁 Auto refresh
  setInterval(loadData, 30000);
</script>

</body>
</html>
