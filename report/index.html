<!DOCTYPE html>
<html>
<head>
  <title>Deployment Status</title>
  <style>
    body {
      font-family: Arial;
      padding: 20px;
      background: #f5f5f5;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      background: white;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: left;
    }
    th {
      background: #333;
      color: white;
    }
    .success { color: green; font-weight: bold; }
    .failed { color: red; font-weight: bold; }
    .in-progress { color: orange; font-weight: bold; }
  </style>
</head>
<body>

<h2>🚀 Deployment Status</h2>

<table>
  <thead>
    <tr>
      <th>Feature</th>
      <th>Status</th>
      <th>Commit</th>
      <th>Timestamp</th>
    </tr>
  </thead>
  <tbody id="table-body">
    <tr><td colspan="4">Loading...</td></tr>
  </tbody>
</table>

<script>
  const url = "https://devopshemant.blob.core.windows.net/state/deployment-state.json";

  async function loadState() {
    try {
      const res = await fetch(url);
      const data = await res.json();

      const row = `
        <tr>
          <td>${data.feature}</td>
          <td class="${data.status}">${data.status}</td>
          <td>${data.commit}</td>
          <td>${data.timestamp}</td>
        </tr>
      `;

      document.getElementById("table-body").innerHTML = row;

    } catch (err) {
      document.getElementById("table-body").innerHTML =
        "<tr><td colspan='4'>Error loading state</td></tr>";
    }
  }

  loadState();

  // 🔁 auto refresh every 30 sec
  setInterval(loadState, 30000);
</script>

</body>
</html>
