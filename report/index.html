<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Release Dashboard</title>

    <style>
        body {
            font-family: Arial;
            padding: 20px;
            background: #fafafa;
        }

        h2 {
            color: #333;
        }

        select, button {
            margin: 10px 5px 10px 0;
            padding: 6px 10px;
            font-size: 14px;
            cursor: pointer;
        }

        #lastRefresh {
            font-size: 12px;
            color: #666;
            margin-left: 10px;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            background: #fff;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }

        th {
            background: #f4f4f4;
        }

        tr:hover {
            background: #f9f9f9;
        }

        .passed {
            color: green;
            font-weight: bold;
        }

        .failed {
            color: red;
            font-weight: bold;
        }
    </style>
</head>
<body>

<h2>Platform DevOps - 🚀 Release Dashboard</h2>

<label><b>Select Release:</b></label>
<select id="releaseDropdown"></select>

<br>
<button onclick="downloadCSV()">⬇ Download CSV</button>
<span id="lastRefresh"></span>

<table>
    <thead>
        <tr>
            <th>Release</th>
            <th>Repo</th>
            <th>Team</th>
            <th>ID</th>
            <th>Filename</th>
            <th>Status</th>
        </tr>
    </thead>
    <tbody id="tableBody"></tbody>
</table>

<script>
let currentCSV = "";

// Load releases
async function loadReleases() {
    const res = await fetch("releases.json?ts=" + Date.now());
    const data = await res.json();

    const dropdown = document.getElementById("releaseDropdown");

    data.releases.forEach(r => {
        const opt = document.createElement("option");
        opt.value = r;
        opt.textContent = r;
        dropdown.appendChild(opt);
    });

    dropdown.addEventListener("change", loadCSV);

    if (data.releases.length > 0) {
        dropdown.value = data.releases[0];
        loadCSV();
    }
}

// Load CSV
async function loadCSV() {
    const release = document.getElementById("releaseDropdown").value;

    const res = await fetch(`${release}/data.csv?ts=${Date.now()}`);
    currentCSV = await res.text();

    const rows = currentCSV.split("\n").slice(1);

    const tbody = document.getElementById("tableBody");
    tbody.innerHTML = "";

    rows.forEach(row => {
        if (!row.trim()) return;

        const [rel, repo, team, id, filename, status] = row.split(",");

        let statusClass = status === "passed" ? "passed" : "failed";

        const tr = `<tr>
            <td>${rel}</td>
            <td>${repo}</td>
            <td>${team}</td>
            <td>${id}</td>
            <td>${filename}</td>
            <td class="${statusClass}">${status}</td>
        </tr>`;

        tbody.innerHTML += tr;
    });

    updateRefreshTime();
}

// Update last refresh time
function updateRefreshTime() {
    const now = new Date();
    const timeStr = now.toLocaleTimeString();
    document.getElementById("lastRefresh").textContent =
        `Last refreshed: ${timeStr}`;
}

// Download CSV
function downloadCSV() {
    const release = document.getElementById("releaseDropdown").value;

    const blob = new Blob([currentCSV], { type: "text/csv" });
    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = `${release}.csv`;
    a.click();
}

// Auto refresh every 30 seconds
setInterval(() => {
    loadCSV();
}, 30000);

loadReleases();
</script>

</body>
</html>
