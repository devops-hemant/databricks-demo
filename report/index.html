<!DOCTYPE html>
<html>
<head>
    <title>Release Dashboard</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        select, button { margin: 10px 0; padding: 6px; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ddd; padding: 8px; }
        th { background: #f4f4f4; }
    </style>
</head>
<body>

<h2>Release Dashboard</h2>

<label>Select Release:</label>
<select id="releaseDropdown"></select>

<br>
<button onclick="downloadCSV()">Download CSV</button>

<table>
    <thead>
        <tr>
            <th>Release</th>
            <th>Repo</th>
            <th>ID</th>
            <th>Filename</th>
            <th>Status</th>
        </tr>
    </thead>
    <tbody id="tableBody"></tbody>
</table>

<script>
let currentCSV = "";

// Load releases
async function loadReleases() {
    const res = await fetch("releases.json");
    const data = await res.json();

    const dropdown = document.getElementById("releaseDropdown");

    data.releases.forEach(r => {
        const opt = document.createElement("option");
        opt.value = r;
        opt.textContent = r;
        dropdown.appendChild(opt);
    });

    dropdown.addEventListener("change", loadCSV);

    if (data.releases.length > 0) {
        dropdown.value = data.releases[0];
        loadCSV();
    }
}

// Load CSV
async function loadCSV() {
    const release = document.getElementById("releaseDropdown").value;

    const res = await fetch(`${release}/data.csv`);
    currentCSV = await res.text();

    const rows = currentCSV.split("\n").slice(1); // skip header

    const tbody = document.getElementById("tableBody");
    tbody.innerHTML = "";

    rows.forEach(row => {
        if (!row.trim()) return;

        const [rel, repo, id, filename, status] = row.split(",");

        const tr = `<tr>
            <td>${rel}</td>
            <td>${repo}</td>
            <td>${id}</td>
            <td>${filename}</td>
            <td>${status}</td>
        </tr>`;

        tbody.innerHTML += tr;
    });
}

// Download CSV
function downloadCSV() {
    const blob = new Blob([currentCSV], { type: "text/csv" });
    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = "data.csv";
    a.click();
}

loadReleases();
</script>

</body>
</html>
